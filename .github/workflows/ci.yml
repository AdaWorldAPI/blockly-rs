name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      # Broken intra-doc links are NOT caught by clippy, and this crate's
      # docs carry the reasoning (why the ValueParam ordinal is anchored
      # here, why the pool is a sibling node). A rename that silently
      # orphans a link degrades the part of the crate that explains it, so
      # the gate is explicit rather than implied by the test run.
      - name: rustdoc broken intra-doc links
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc -p blockly-abi -p blockly-shim --no-deps
      # The executable no-second-vocabulary trap (ruling R1/Q6): after the
      # flip onto ogar-loco, consumer-local definitions of the generic ABI
      # symbols must NOT exist in this repo. Re-exports (`use`) are fine —
      # a local `struct FunctionNode`/`fn stack_arity` is a second
      # vocabulary starting, and this step fails loudly the day one returns.
      - name: consumer-local generic ABI symbols must not exist (post-flip trap)
        run: |
          set -e
          if grep -rnE "(pub )?(struct (FunctionNode|ConstantPool|Program)\b|fn (stack_arity|body_refs)\b)" crates/*/src; then
            echo "::error::consumer-local generic ABI definition found — the shared surface lives in ogar-loco (ruling R1/Q6)"
            exit 1
          fi
          echo "trap silent: no consumer-local generic ABI definitions"
