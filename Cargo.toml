[workspace]
resolver = "3"
members = ["crates/blockly-abi", "crates/blockly-shim", "crates/blockly-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/blockly-rs"
authors = ["AdaWorldAPI"]
rust-version = "1.95"

[workspace.dependencies]
# The block vocabulary + the V3 function-body ABI (OGAR #234/#235/#236).
# Deliberately the ONLY substrate dependency: this half of the arc stays
# permissive, and never links the GPL `rash` JIT (that boundary lives in
# scratch-rs). See OGAR docs/BLOCK-EDITOR-PLAN.md § "Where the seam falls".
ogar-blockly = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The vocabulary-agnostic call ABI the palette rides on (hoisted in OGAR
# #239/#241). Post-flip, blockly-abi consumes these types directly; its own
# local copies are DELETED and CI forbids their return (the executable
# no-second-vocabulary trap, ruling R1/Q6).
ogar-loco = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The hot-plug AUTHORITY (OGAR #174/#175, lance-graph #658): the domain action
# tables + `capability_registry::resolve_hotplug`, which joins this consumer's
# plugged classids against `class_ids::ALL` and returns the concepts + every
# capability whose subject is one of them.
ogar-vocab = { git = "https://github.com/AdaWorldAPI/OGAR", branch = "main" }
# The hot-plug SOCKET (zero-dep): `HotPlug` / `Activation` / `ActivationDrift`
# / `CapabilityAuthority`. The agnostic shape this consumer's ONE registration
# const is written in, so the plug is authority-agnostic at the type level.
lance-graph-contract = { git = "https://github.com/AdaWorldAPI/lance-graph", branch = "main" }
