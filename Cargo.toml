[workspace]
resolver = "3"
members = ["crates/blockly-abi", "crates/blockly-run", "crates/blockly-shim", "crates/blockly-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AdaWorldAPI/blockly-rs"
authors = ["AdaWorldAPI"]
rust-version = "1.95"

# ─────────────────────────────────────────────────────────────────────
# OGAR deps are PATH deps to the sibling checkout. PINS ARE FORBIDDEN.
#
# A `git = "...", branch = "main"` dep looks unpinned and is not: cargo
# writes the resolved rev into Cargo.lock, so the consumer silently
# freezes at whatever OGAR commit it last resolved. That is the pin the
# whole hot-plug design exists to avoid — "wenn's knallt, dann einmal —
# nicht 200 Pins monitoren". It also HIDES upstream breakage instead of
# surfacing it: this repo kept compiling against a stale `ogar-blockly`
# after 0x17 moved to the substrate, because the lock pinned the old rev.
#
# Sibling layout (same as tesseract-rs): OGAR is checked out beside this
# repo, so `../OGAR` resolves both locally and in CI (see ci.yml, which
# checks this repo out into a `blockly-rs/` subdir for exactly that).
# ─────────────────────────────────────────────────────────────────────
[workspace.dependencies]

# The block PALETTE vocabulary — `BlockConcept::Palette` (0x1717), the
# consumer slot seated above the substrate's own 0x1701/0x1702 (OGAR
# #255). Deliberately the only frontend dependency: this half of the arc
# stays permissive and never links the GPL `rash` JIT (that boundary
# lives in scratch-rs). See OGAR docs/BLOCK-EDITOR-PLAN.md.
# The vocabulary-agnostic call ABI the palette rides on, and the owner of
# the node shapes themselves (`LocoConcept::{FunctionBody, Inventory}`).
# Post-flip, blockly-abi consumes these types directly; its own local
# copies are DELETED and CI forbids their return (the executable
# no-second-vocabulary trap, ruling R1/Q6).
ogar-loco = { path = "../OGAR/crates/ogar-loco" }

# The a2ui canonical surface, both halves. Same sibling checkout as
# `ogar-loco` -- no new repository, and the Dockerfile already clones it.
#
# These replace the demo's JSON read-surface. `ogar-a2ui-frame` is BYTE-NATIVE
# (`Frame::to_le_bytes`; its serde derive is feature-gated and left OFF), so
# the program crossing the wire is the stored bytes rather than a description
# of them -- charter T3, and the whole point of an ABI-shaped SoA.
ogar-a2ui-frame = { path = "../OGAR/crates/ogar-a2ui-frame" }
ogar-render-askama = { path = "../OGAR/crates/ogar-render-askama" }
