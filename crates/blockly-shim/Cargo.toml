[package]
name = "blockly-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The membrane: Blockly's own save JSON in, BlockRecord out. serde lives HERE and nowhere else — blockly-abi stays serialization-free, and this crate is the one place a foreign format is allowed to touch the arc."

[dependencies]
blockly-abi = { path = "../blockly-abi" }
# The substrate, direct: the call encoding, lane carvings and node layout.
# Reached straight rather than through a re-export, so no crate has to be
# imported for the sole purpose of forwarding another crate's types.
ogar-loco = { workspace = true }
# The ONLY serde in this workspace, and the reason this crate exists as a
# separate one. Charter T3: "serde/JSON/proto exist ONLY at a membrane, behind
# a feature, never on the hot path." A membrane is a crate boundary here, so
# the dependency cannot leak into `blockly-abi` by accident — it would take a
# manifest edit, not an import.
serde_json = "1"
# Raw assets (costume bitmaps/vectors, sound files) are NOT program data:
# they never enter a node or a register, only the intake boundary handles
# them, keyed by their sb3 `md5ext`. Both stores are optional so the lean
# membrane stays lean; the `AssetStore` seam itself is always present.
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
object_store = { version = "0.13", features = ["aws"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[features]
# Read a whole `.sb3` archive: project.json + the asset files, into a store.
sb3-archive = ["dep:zip"]
# An S3-compatible asset store (Tigris on Railway) from the standard `AWS_*`
# variables — the same names lance-graph's hydration reads.
s3 = ["dep:object_store", "dep:tokio"]

[dev-dependencies]
blockly-run = { path = "../blockly-run" }
