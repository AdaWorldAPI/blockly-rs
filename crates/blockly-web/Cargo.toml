[package]
name = "blockly-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The showcase: real Blockly drags blocks in the browser; every change is cast through blockly-shim + blockly-abi into V3 SoA rows, and the page shows the calls, the 512-byte node, the text projection, the round-trip badge — and the refusals, loudly. Single binary, binds 0.0.0.0:$PORT for Railway."

[dependencies]
blockly-abi = { path = "../blockly-abi" }
# The substrate, direct: the call encoding, lane carvings and node layout.
# Reached straight rather than through a re-export, so no crate has to be
# imported for the sole purpose of forwarding another crate's types.
ogar-loco = { workspace = true }
ogar-a2ui-frame = { workspace = true }
ogar-render-askama = { workspace = true }
blockly-shim = { path = "../blockly-shim" }
blockly-run = { path = "../blockly-run" }

askama = "0.12"
# Required alongside askama: `ogar-render-askama` now declares `askama_axum`,
# which turns on `askama/with-axum` graph-wide, and the derive then expands to
# `::askama_axum` in EVERY crate that derives `Template` (see that crate's
# Cargo.toml). Without this line the bin fails with E0433 on the derive.
askama_axum = "0.4"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
